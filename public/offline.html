<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f8fc" />
    <title>Hors connexion | Maucode</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        color: #0b0f2a;
        background-color: #f7f8fc;
        background-image: radial-gradient(#d9dcf0 1px, transparent 1px);
        background-size: 22px 22px;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 28px;
        background: #fff;
        border: 1px solid #dfe2f3;
        border-radius: 16px;
      }
      img {
        display: block;
        width: 64px;
        height: 64px;
        margin-bottom: 20px;
        border-radius: 14px;
      }
      h1 {
        font-size: 22px;
        line-height: 1.25;
        letter-spacing: -0.01em;
      }
      p {
        margin-top: 10px;
        color: #4b5170;
        font-size: 15px;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        margin-top: 22px;
        padding: 0 22px;
        border-radius: 999px;
        background: #3839af;
        color: #fff;
        font-weight: 700;
        font-size: 15px;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #0b0f2a;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="64" height="64" />
      <h1>Pas de connexion internet</h1>
      <p>
        Maucode a besoin d'internet pour afficher vos formations et votre
        compte. Vérifiez votre réseau, puis réessayez.
      </p>
      <a href="">Réessayer</a>
    </main>
  </body>
</html>
